<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据标注流程 V2 - 结果可视化</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body data-page="visualize" data-task-id="{{ task_id }}">
  <section id="loginView" class="loginView">
    <form id="loginForm" class="loginCard">
      <h1>数据标注流程 V2</h1>
      <input id="loginUsernameInput" autocomplete="username" placeholder="用户名">
      <button type="submit">进入可视化</button>
    </form>
  </section>

  <div id="appView" class="hidden">
    <header class="topbar hidden">
      <div>
        <h1>数据标注流程 V2</h1>
        <p id="sessionLine"></p>
      </div>
      <div class="topbarActions">
        <a class="buttonLike ghost" href="/">返回任务</a>
        <button id="logoutBtn" class="ghost" type="button">退出</button>
      </div>
    </header>

    <main>
      <section id="visualizationWorkbench" class="workbench">
        <div class="workHeader">
          <div>
            <strong id="visualizationTitle"></strong>
            <span id="visualizationProgress"></span>
          </div>
          <nav id="visualizationStageTabs" class="stageTabs" aria-label="可视化阶段"></nav>
          <div class="pager">
            <button id="visualizationPrevBtn" class="ghost" type="button">上一条</button>
            <input id="visualizationJumpInput" type="number" min="1">
            <button id="visualizationJumpBtn" class="ghost" type="button">跳转</button>
            <button id="visualizationNextBtn" type="button">下一条</button>
            <button id="openVisualizationFilterBtn" class="ghost" type="button">筛选</button>
          </div>
        </div>

        <div id="emptyVisualization" class="panel hidden">暂无数据</div>

        <div id="visualizationBody" class="visualizationGrid">
          <figure>
            <figcaption>原图</figcaption>
            <div id="visualizationSrcPath" class="imagePath"></div>
            <img id="visualizationSrcImage" alt="原图" loading="lazy">
          </figure>
          <figure>
            <figcaption>目标图</figcaption>
            <div id="visualizationDstPath" class="imagePath"></div>
            <img id="visualizationDstImage" alt="目标图" loading="lazy">
          </figure>
          <aside id="visualizationResultPanel" class="panel visualizationPanel"></aside>
        </div>
      </section>
    </main>

    <div id="visualizationFilterOverlay" class="drawerOverlay hidden"></div>
    <aside id="visualizationFilterPanel" class="filterDrawer hidden" aria-hidden="true">
      <div class="drawerHeader">
        <h2>结果筛选</h2>
        <button id="closeVisualizationFilterBtn" class="ghost" type="button">关闭</button>
      </div>
      <div id="visualizationFilterBody" class="filterBody"></div>
      <div class="drawerActions">
        <button id="clearVisualizationFilterBtn" class="ghost" type="button">清空</button>
        <button id="applyVisualizationFilterBtn" type="button">筛选</button>
      </div>
    </aside>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="{{ url_for('static', filename='app.js') }}?v=20260609-task-editing"></script>
</body>
</html>
