<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ dataset.name }} - 导入</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body data-page="imports" data-dataset-id="{{ dataset.dataset_id }}">
  <header class="topbar">
    <div>
      <h1>{{ dataset.name }}</h1>
      <p>导入标签和历史标注</p>
    </div>
    <div class="topbarActions">
      <a class="buttonLike ghost" href="/datasets/{{ dataset.dataset_id }}">返回数据集</a>
      <a class="buttonLike ghost" href="/datasets/{{ dataset.dataset_id }}/visualize?stage=label">查看结果</a>
    </div>
  </header>

  <main class="pageShell">
    <section class="workbench">
      <div class="workHeader">
        <div>
          <strong>导入任务</strong>
          <span id="importStatus">等待输入</span>
        </div>
        <div class="pager">
          <button id="validateImportBtn" class="ghost" type="button">Dry run</button>
          <button id="commitImportBtn" type="button">Commit</button>
        </div>
      </div>

      <div class="sampleGrid">
        <section class="panel sampleControls">
          <label>
            JSONL path
            <input id="importPathInput" placeholder="/absolute/path/import.jsonl">
          </label>
          <label>
            Merge policy
            <select id="mergePolicySelect">
              <option value="patch_labels">patch_labels</option>
              <option value="replace_labels">replace_labels</option>
              <option value="keep_existing">keep_existing</option>
            </select>
          </label>
          <label>
            Stage record policy
            <select id="stagePolicySelect">
              <option value="import_as_external_snapshot">import_as_external_snapshot</option>
              <option value="replace_effective_record">replace_effective_record</option>
              <option value="audit_only">audit_only</option>
            </select>
          </label>
          <div id="importMessage" class="messageLine"></div>
        </section>

        <section id="importReport" class="panel">
          <div class="sectionHead">
            <h2>报告</h2>
            <a id="errorsLink" class="buttonLike ghost hidden" href="#">Errors</a>
          </div>
          <div id="reportRows" class="bucketRows">
            <p class="mutedText">暂无报告</p>
          </div>
        </section>
      </div>
    </section>
  </main>

  <main id="imports-app" data-page="imports" data-dataset-id="{{ dataset.dataset_id }}" class="hidden"></main>
  <script type="module" src="{{ url_for('static', filename='importsPage.js') }}"></script>
</body>
</html>
