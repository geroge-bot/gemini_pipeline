<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ dataset.name }} - 结果查看</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body data-page="visualize" data-dataset-id="{{ dataset.dataset_id }}" data-stage="{{ stage }}">
  <header class="topbar">
    <div>
      <h1>{{ dataset.name }}</h1>
      <p id="resultSummary">结果查看</p>
    </div>
    <div class="topbarActions">
      <a class="buttonLike ghost" href="/datasets/{{ dataset.dataset_id }}">返回数据集</a>
      <a class="buttonLike ghost" href="/datasets/{{ dataset.dataset_id }}/sample">抽样</a>
    </div>
  </header>

  <main class="pageShell">
    <section class="workbench">
      <div class="workHeader">
        <div class="resultControls">
          <label>
            阶段
            <select id="stageSelect">
              <option value="rough">粗筛</option>
              <option value="fine">精筛</option>
              <option value="sample">抽样</option>
              <option value="label">标签</option>
            </select>
          </label>
          <label>
            每页
            <select id="pageSizeSelect">
              <option value="10">10</option>
              <option value="25">25</option>
              <option value="50">50</option>
            </select>
          </label>
        </div>
        <div class="pager">
          <button id="prevPageBtn" class="ghost" type="button">上一页</button>
          <button id="nextPageBtn" type="button">下一页</button>
        </div>
      </div>

      <div id="resultsHost" class="resultsList"></div>
    </section>
  </main>

  <main id="visualize-app" data-page="visualize" data-dataset-id="{{ dataset.dataset_id }}" data-stage="{{ stage }}" class="hidden"></main>
  <script type="module" src="{{ url_for('static', filename='visualizePage.js') }}"></script>
</body>
</html>
