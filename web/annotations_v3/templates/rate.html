<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ dataset.name }} - {{ stage }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body data-page="rate" data-dataset-id="{{ dataset.dataset_id }}" data-stage="{{ stage }}">
  <section id="loginView" class="loginView">
    <form id="loginForm" class="loginCard">
      <h1>数据标注流程 V3</h1>
      <input id="loginUsernameInput" autocomplete="username" placeholder="用户名">
      <button type="submit">进入标注</button>
    </form>
  </section>

  <div id="appView" class="hidden">
    <header class="topbar hidden">
      <div>
        <h1>数据标注流程 V3</h1>
        <p id="sessionLine"></p>
      </div>
      <div class="topbarActions">
        <a class="buttonLike ghost" href="/">返回任务</a>
        <button id="logoutBtn" class="ghost" type="button">退出</button>
      </div>
    </header>

    <main>
      <section id="workbench" class="workbench">
        <div class="workHeader">
          <div>
            <strong id="workTitle"></strong>
            <span id="workProgress"></span>
          </div>
          <div class="pager">
            <button id="prevBtn" class="ghost" type="button">上一条</button>
            <button id="nextBtn" type="button">保存并下一条（Space）</button>
          </div>
        </div>

        <div id="emptyStage" class="panel hidden">暂无数据</div>

        <div id="stageBody" class="stageGrid">
          <div id="imagePairHost" class="imagePair"></div>
          <div id="imagePromptHost" class="imagePromptHost"></div>
          <div id="ratingControls" class="panel annotationPanel">
            <div id="saveMessage" class="messageLine"></div>
            <form id="stageForm" class="stageForm"></form>
            <details class="readonlyPanel">
              <summary>上游记录</summary>
              <div id="readonlyHost"></div>
            </details>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast hidden"></div>
  <main id="rate-app" data-page="rate" data-dataset-id="{{ dataset.dataset_id }}" data-stage="{{ stage }}" class="hidden"></main>
  <script type="module" src="{{ url_for('static', filename='ratePage.js') }}"></script>
</body>
</html>
