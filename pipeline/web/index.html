<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Pipeline - Studio Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.4);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
            --text-main: #1d1d1f;
            --text-muted: #86868b;
            --accent: #0071e3;
            --accent-hover: #0077ed;
            --error: #ff3b30;
            --success: #34c759;
            --border: #d2d2d7;
            --sidebar-width: 300px;
            --font-stack: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            font-family: var(--font-stack);
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* === Top Nav Bar === */
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 28px;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .top-nav .nav-brand {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.01em;
        }

        .top-nav .nav-links {
            display: flex;
            gap: 8px;
        }

        .nav-link {
            padding: 7px 16px;
            border-radius: 980px;
            font-size: 0.85rem;
            font-weight: 500;
            text-decoration: none;
            color: var(--text-main);
            background: rgba(0,0,0,0.04);
            transition: all 0.2s;
        }

        .nav-link:hover { background: rgba(0,0,0,0.08); }
        .nav-link.active {
            background: var(--accent);
            color: white;
        }

        /* === Layout === */
        .app-layout {
            display: flex;
            min-height: calc(100vh - 52px);
        }

        /* === Sidebar === */
        .sidebar {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            padding: 20px;
            border-right: 1px solid var(--border);
            background: rgba(255,255,255,0.45);
            backdrop-filter: blur(10px);
            overflow-y: auto;
            max-height: calc(100vh - 52px);
            position: sticky;
            top: 52px;
        }

        .sidebar-title {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            margin-bottom: 12px;
            margin-top: 16px;
        }

        .sidebar-title:first-child { margin-top: 0; }

        /* === Main Content === */
        .main-content {
            flex: 1;
            padding: 24px 32px;
            overflow-y: auto;
        }

        /* Glassmorphism Card */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 18px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            padding: 24px;
            margin-bottom: 20px;
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .glass-card:hover { transform: translateY(-1px); }

        .card-header {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Forms */
        .form-group { margin-bottom: 12px; }

        label {
            display: block;
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        input[type="text"], input[type="number"], select, textarea {
            width: 100%;
            padding: 9px 11px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.9);
            font-family: inherit;
            font-size: 0.88rem;
            color: var(--text-main);
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.12);
        }

        textarea {
            resize: vertical;
            min-height: 220px;
            line-height: 1.5;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 18px;
            border-radius: 980px;
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--accent);
            color: white;
            box-shadow: 0 2px 8px rgba(0, 113, 227, 0.3);
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: scale(1.02);
        }

        .btn-primary:active { transform: scale(0.98); }

        .btn-primary:disabled {
            background-color: #a1c6ea;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background-color: rgba(0,0,0,0.05);
            color: var(--text-main);
        }

        .btn-secondary:hover { background-color: rgba(0,0,0,0.08); }

        .btn-success {
            background: linear-gradient(135deg, #34c759, #30d158);
            color: white;
            box-shadow: 0 2px 8px rgba(52, 199, 89, 0.3);
        }

        .btn-success:hover { transform: scale(1.02); }

        /* Save btn in sidebar */
        .sidebar-save-btn {
            width: 100%;
            margin-top: 16px;
            padding: 10px;
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 600;
        }

        /* Stage Grid */
        .stage-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-top: 16px;
        }

        .stage-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px 8px;
            background: rgba(255,255,255,0.7);
            border: 1px solid var(--border);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .stage-btn:hover {
            background: #fff;
            border-color: var(--accent);
            box-shadow: 0 4px 12px rgba(0, 113, 227, 0.1);
            transform: translateY(-2px);
        }

        .stage-btn:active { transform: scale(0.97); }

        .stage-icon { font-size: 1.5rem; margin-bottom: 6px; }

        .stage-title {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-main);
            text-align: center;
        }

        /* Dashboard Stats */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        .stat-box {
            background: rgba(255,255,255,0.8);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
            margin: 2px 0;
            font-variant-numeric: tabular-nums;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .log-panel {
            background: rgba(0,0,0,0.03);
            border-radius: 10px;
            padding: 14px;
            font-family: monospace;
            font-size: 0.82rem;
            color: var(--text-main);
            min-height: 50px;
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid rgba(0,0,0,0.05);
            white-space: pre-wrap;
            word-break: break-all;
        }

        .badge {
            padding: 5px 10px;
            border-radius: 980px;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .badge.idle { background: rgba(0,0,0,0.05); color: var(--text-muted); }
        .badge.running { background: rgba(0, 113, 227, 0.1); color: var(--accent); }

        .pulsing-dot {
            width: 7px;
            height: 7px;
            background-color: currentColor;
            border-radius: 50%;
        }

        .badge.running .pulsing-dot {
            animation: pulse-dot 1.5s infinite ease-in-out;
        }

        @keyframes pulse-dot {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0.5; }
        }

        /* Model select styling */
        .model-select-group {
            background: rgba(0,0,0,0.02);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 8px;
        }

        .model-select-group label {
            font-size: 0.72rem;
            margin-bottom: 3px;
        }

        .model-select-group select {
            padding: 7px 8px;
            font-size: 0.82rem;
        }

        /* View Results button */
        .view-results-btn {
            display: none;
            margin-top: 12px;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            background: linear-gradient(135deg, #5e5ce6, #bf5af2);
            color: white;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(94, 92, 230, 0.3);
        }

        .view-results-btn:hover {
            transform: scale(1.02);
        }

        .btn-danger {
            display: none;
            margin-top: 12px;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            background: linear-gradient(135deg, #ff3b30, #ff6b6b);
            color: white;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(255, 59, 48, 0.3);
        }

        .btn-danger:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 16px rgba(255, 59, 48, 0.4);
        }

        .btn-danger:active {
            transform: scale(0.98);
        }

        .btn-danger:disabled {
            background: linear-gradient(135deg, #cc9999, #ddaaaa);
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            border: none;
            border-top: 1px solid var(--border);
            margin: 14px 0;
        }
    </style>
</head>
<body>

<!-- Top Navigation -->
<div class="top-nav">
    <div class="nav-brand">🍽️ Food Production Studio</div>
    <div class="nav-links">
        <a href="/" class="nav-link active">Dashboard</a>
        <a href="/visualize" class="nav-link">📊 Visualization</a>
    </div>
</div>

<div class="app-layout">
    <!-- === LEFT SIDEBAR: Pipeline Settings === -->
    <div class="sidebar">
        <div class="sidebar-title">📁 Directories</div>
        <div class="form-group">
            <label>Input Directory</label>
            <input type="text" id="input_dir" value="{{ config.input_directory }}">
        </div>
        <div class="form-group">
            <label>Output Directory</label>
            <input type="text" id="output_dir" value="{{ config.output_directory }}">
        </div>

        <hr class="divider">
        <div class="sidebar-title">⚙️ Pipeline</div>
        <div class="form-group">
            <label>Concurrency (Workers)</label>
            <input type="number" id="workers" value="{{ config.max_workers }}" min="1" max="20">
        </div>
        <div class="form-group">
            <label>Random Seed</label>
            <input type="number" id="random_seed" value="{{ config.random_seed }}" min="0">
        </div>
        <div class="form-group">
            <label>Sample Size (0 for all)</label>
            <input type="number" id="sample_size" value="{{ config.sample_size }}" min="0">
        </div>

        <hr class="divider">
        <div class="sidebar-title">🤖 Models</div>
        <div class="model-select-group">
            <label>Analysis (Text)</label>
            <select id="model_analysis">
                {% for m in text_model_choices %}
                <option value="{{ m }}" {% if m == config.model_analysis %}selected{% endif %}>{{ m }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="model-select-group">
            <label>Generation (Image)</label>
            <select id="model_generation">
                {% for m in image_model_choices %}
                <option value="{{ m }}" {% if m == config.model_generation %}selected{% endif %}>{{ m }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="model-select-group">
            <label>Shorten (Text)</label>
            <select id="model_shorten">
                {% for m in text_model_choices %}
                <option value="{{ m }}" {% if m == config.model_shorten %}selected{% endif %}>{{ m }}</option>
                {% endfor %}
            </select>
        </div>

        <hr class="divider">
        <div class="sidebar-title">🔑 API Keys</div>
        <div class="form-group">
            <label>Text API Key</label>
            <input type="text" id="api_key" placeholder="For Analysis & Shorten">
        </div>
        <div class="form-group">
            <label>Image API Key</label>
            <input type="text" id="api_key_image" placeholder="For Image Generation">
        </div>
        <button class="btn btn-primary sidebar-save-btn" onclick="saveConfig()">💾 Save Settings</button>
    </div>

    <!-- === RIGHT MAIN AREA === -->
    <div class="main-content">

        <!-- 1. Prompts -->
        <div class="glass-card">
            <div class="card-header" style="margin-bottom: 12px;">
                <span>📝 Prompt Templates</span>
            </div>
            <!-- Pipeline stage buttons -->
            <div style="display: flex; gap: 10px; margin-bottom: 14px;">
                <button id="btn_cat_analysis" class="btn btn-primary" style="flex: 1;" onclick="setPromptCategory('Analysis Prompts')">Step 1: Vision</button>
                <button id="btn_cat_shorten" class="btn btn-secondary" style="flex: 1;" onclick="setPromptCategory('Shorten Prompts')">Step 3: Shorten</button>
                <button id="btn_cat_validate" class="btn btn-secondary" style="flex: 1;" onclick="setPromptCategory('Validation Prompts')">Step 4: Validate</button>
            </div>
            <input type="hidden" id="prompt_category" value="Analysis Prompts">

            <!-- Prompt selection -->
            <div style="display: flex; gap: 8px; margin-bottom: 12px; align-items: center;">
                <select id="prompt_selector" onchange="loadSelectedPrompt()" style="flex: 1; padding: 8px 12px; font-weight: 500; font-size: 0.9rem;">
                </select>
            </div>

            <div class="form-group">
                <div style="display: flex; gap: 8px; margin-bottom: 10px;">
                    <input type="text" id="prompt_name" placeholder="Name for saving (e.g. my_custom_v1)" style="flex: 1; font-weight: 500;">
                    <button class="btn btn-secondary" style="white-space: nowrap;" title="Save current content back to config/prompts.md for future use" onclick="savePromptTemplate()">💾 Save to prompts.md</button>
                </div>
                <textarea id="prompt_text" placeholder="Write your prompt instruction here..." oninput="onPromptInput()"></textarea>
            </div>
        </div>

        <!-- 2. Execution Engine -->
        <div class="glass-card">
            <div class="card-header">
                <span>🚀 Execution Engine</span>
                <div id="status_badge" class="badge idle"><div class="pulsing-dot"></div> <span id="badge_text">IDLE</span></div>
            </div>

            <!-- Live Stats -->
            <div class="dashboard-grid">
                <div class="stat-box">
                    <div class="stat-label">Source Images</div>
                    <div class="stat-number" id="stat_src">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Schemes Analyzed</div>
                    <div class="stat-number" id="stat_json">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Images Generated</div>
                    <div class="stat-number" id="stat_gen">0</div>
                </div>
            </div>

            <div class="log-panel" id="log_panel">
                Waiting to start...
            </div>

            <!-- Stage Action Buttons -->
            <div class="stage-grid">
                <div class="stage-btn" onclick="runStage('analysis')">
                    <div class="stage-icon">🔍</div>
                    <div class="stage-title">A. Analyze</div>
                </div>
                <div class="stage-btn" onclick="runStage('generation')">
                    <div class="stage-icon">🎨</div>
                    <div class="stage-title">B. Generate</div>
                </div>
                <div class="stage-btn" onclick="runStage('shorten')">
                    <div class="stage-icon">✂️</div>
                    <div class="stage-title">C. Shorten</div>
                </div>
                <div class="stage-btn" onclick="runStage('validate')">
                    <div class="stage-icon">🔎</div>
                    <div class="stage-title">D. Validate</div>
                </div>
                <div class="stage-btn" onclick="runStage('all')" style="background: var(--accent); color: white; border: none;">
                    <div class="stage-icon">✨</div>
                    <div class="stage-title" style="color: white; font-weight: 700;">Run All</div>
                </div>
            </div>

            <!-- Stop Pipeline Button (appears when running) -->
            <button class="btn-danger" id="stop_btn" onclick="stopPipeline()">
                ⏹ Stop Pipeline
            </button>

            <!-- View Results Button (appears after pipeline finishes) -->
            <button class="view-results-btn" id="view_results_btn" onclick="goToVisualize()">
                📊 View Results →
            </button>
            
            <button class="view-results-btn" id="view_errors_btn" onclick="goToVisualizeErrors()" style="background: linear-gradient(135deg, #ff3b30, #ff6b6b); display: block; margin-top: 12px; box-shadow: 0 4px 12px rgba(255, 59, 48, 0.3);">
                🚨 View Error Results →
            </button>
        </div>
    </div>
</div>

<script>
    // Prompt State
    let allPrompts = {{ prompts | tojson | safe }};
    let wasRunning = false;
    let selectedPromptsText = {
        'Analysis Prompts': '',
        'Shorten Prompts': '',
        'Validation Prompts': ''
    };

    // Default prompt keys from config.py
    const DEFAULT_PROMPT_KEYS = {
        'Analysis Prompts': '{{ default_analysis_key }}',
        'Shorten Prompts': '{{ default_shorten_key }}',
        'Validation Prompts': '{{ default_validation_key }}'
    };
    
    window.onload = function() {
        setPromptCategory('Analysis Prompts');
        refreshStats();
    };

    function setPromptCategory(cat) {
        document.getElementById('prompt_category').value = cat;
        if(cat === 'Analysis Prompts') {
            document.getElementById('btn_cat_analysis').className = 'btn btn-primary';
            document.getElementById('btn_cat_shorten').className = 'btn btn-secondary';
            document.getElementById('btn_cat_validate').className = 'btn btn-secondary';
        } else if (cat === 'Shorten Prompts') {
            document.getElementById('btn_cat_analysis').className = 'btn btn-secondary';
            document.getElementById('btn_cat_shorten').className = 'btn btn-primary';
            document.getElementById('btn_cat_validate').className = 'btn btn-secondary';
        } else {
            document.getElementById('btn_cat_analysis').className = 'btn btn-secondary';
            document.getElementById('btn_cat_shorten').className = 'btn btn-secondary';
            document.getElementById('btn_cat_validate').className = 'btn btn-primary';
        }
        loadCategoryPrompts();
        
        // Restore active text if previously edited or selected
        document.getElementById('prompt_text').value = selectedPromptsText[cat];
        
        // Deselect if active text is empty and selector has a value
        if (!selectedPromptsText[cat]) {
            document.getElementById('prompt_selector').value = "";
            document.getElementById('prompt_name').value = "";
        } else {
            // we should manually try to match selector by key logic if needed,
            // but for simplicity it stays as is unless they change prompt_text logic.
        }
    }

    function loadCategoryPrompts() {
        const cat = document.getElementById('prompt_category').value;
        const selector = document.getElementById('prompt_selector');
        const defaultKey = DEFAULT_PROMPT_KEYS[cat] || '';
        
        selector.innerHTML = '';
        
        const emptyOpt = document.createElement('option');
        emptyOpt.value = "";
        emptyOpt.innerText = "-- 请明确选择一个 Prompt 版本 / Please select a prompt version --";
        emptyOpt.disabled = true;
        emptyOpt.selected = true;
        selector.appendChild(emptyOpt);

        if (allPrompts[cat]) {
            let keys = Object.keys(allPrompts[cat]);
            keys.sort((a, b) => {
                if(a === defaultKey) return -1;
                if(b === defaultKey) return 1;
                return a.localeCompare(b);
            });
            for (let name of keys) {
                const opt = document.createElement('option');
                opt.value = name;
                opt.innerText = name === defaultKey ? `⭐ ${name} (Recommend Default)` : name;
                selector.appendChild(opt);
            }
        }
        selector.value = "";
    }

    function loadSelectedPrompt() {
        const cat = document.getElementById('prompt_category').value;
        const name = document.getElementById('prompt_selector').value;
        const textarea = document.getElementById('prompt_text');
        const nameInput = document.getElementById('prompt_name');
        
        if (cat && name && allPrompts[cat] && allPrompts[cat][name]) {
            textarea.value = allPrompts[cat][name];
            nameInput.value = name;
            selectedPromptsText[cat] = textarea.value;
        } else {
            textarea.value = '';
            nameInput.value = '';
            selectedPromptsText[cat] = '';
        }
    }
    
    function onPromptInput() {
        const cat = document.getElementById('prompt_category').value;
        selectedPromptsText[cat] = document.getElementById('prompt_text').value;
    }

    function savePromptTemplate() {
        const cat = document.getElementById('prompt_category').value;
        const name = document.getElementById('prompt_name').value;
        const content = document.getElementById('prompt_text').value;

        if (!name || !content) return alert('Name and content required.');

        fetch('/api/prompts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ category: cat, name: name, content: content })
        })
        .then(res => res.json())
        .then(data => {
            if(data.status === 'success') {
                alert('Saved successfully!');
                fetch('/api/prompts').then(r=>r.json()).then(d => {
                    allPrompts = d;
                    document.getElementById('prompt_category').value = cat;
                    loadCategoryPrompts();
                    document.getElementById('prompt_selector').value = name;
                });
            } else alert('Error: ' + data.message);
        });
    }

    function saveConfig() {
        const payload = {
            input_directory: document.getElementById('input_dir').value,
            output_directory: document.getElementById('output_dir').value,
            max_workers: parseInt(document.getElementById('workers').value),
            random_seed: parseInt(document.getElementById('random_seed').value),
            sample_size: parseInt(document.getElementById('sample_size').value) || 0,
            api_key: document.getElementById('api_key').value || null,
            api_key_image: document.getElementById('api_key_image').value || null,
            model_analysis: document.getElementById('model_analysis').value,
            model_generation: document.getElementById('model_generation').value,
            model_shorten: document.getElementById('model_shorten').value,
        };
        fetch('/api/config', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(() => {
            alert("Settings saved!");
            refreshStats();
        });
    }

    // Engine Polling & Stats
    setInterval(() => {
        pollStatus();
        refreshStats();
    }, 2500);

    function refreshStats() {
        fetch('/api/stats')
            .then(r => r.json())
            .then(data => {
                document.getElementById('stat_src').innerText = data.source_images_count || 0;
                document.getElementById('stat_json').innerText = data.generated_jsons_count || 0;
                document.getElementById('stat_gen').innerText = data.generated_images_count || 0;
            }).catch(()=>{});
    }

    function pollStatus() {
        fetch('/api/status')
            .then(res => res.json())
            .then(data => {
                const badge = document.getElementById('status_badge');
                const badgeTxt = document.getElementById('badge_text');
                const logPanel = document.getElementById('log_panel');
                const viewBtn = document.getElementById('view_results_btn');
                const stopBtn = document.getElementById('stop_btn');

                if (data.is_running) {
                    badge.className = 'badge running';
                    badgeTxt.innerText = data.is_cancelling ? 'STOPPING…' : 'EXECUTING…';
                    
                    // Show/update stop button
                    stopBtn.style.display = 'block';
                    if (data.is_cancelling) {
                        stopBtn.disabled = true;
                        stopBtn.innerHTML = '⏳ Stopping…';
                    } else {
                        stopBtn.disabled = false;
                        stopBtn.innerHTML = '⏹ Stop Pipeline';
                    }
                    
                    if (data.logs) {
                        logPanel.innerText = data.logs;
                        logPanel.scrollTop = logPanel.scrollHeight;
                    } else {
                        logPanel.innerText = "Processing tasks in background...";
                    }
                    
                    wasRunning = true;
                    viewBtn.style.display = 'block';
                    viewBtn.innerHTML = '📊 View Results (Running) →';
                } else {
                    badge.className = 'badge idle';
                    badgeTxt.innerText = 'IDLE';
                    
                    // Hide stop button when idle
                    stopBtn.style.display = 'none';
                    stopBtn.disabled = false;
                    stopBtn.innerHTML = '⏹ Stop Pipeline';
                    
                    if (data.logs && data.logs.trim().length > 0) {
                        logPanel.innerText = data.logs + (data.last_result ? '\n\n[' + new Date().toLocaleTimeString() + '] ' + data.last_result : '');
                        logPanel.scrollTop = logPanel.scrollHeight;
                    } else if (data.last_result) {
                        logPanel.innerText = `[${new Date().toLocaleTimeString()}] ${data.last_result}`;
                    }
                    
                    // Show "View Results" button if pipeline just finished
                    if (wasRunning && data.last_result) {
                        viewBtn.style.display = 'block';
                        viewBtn.innerHTML = '📊 View Results →';
                        wasRunning = false;
                    }
                }
            }).catch(()=>{});
    }

    function stopPipeline() {
        if (!confirm('确认要停止当前正在运行的 Pipeline 吗？\nAre you sure you want to stop the running pipeline?')) {
            return;
        }
        const stopBtn = document.getElementById('stop_btn');
        stopBtn.disabled = true;
        stopBtn.innerHTML = '⏳ Stopping…';
        
        fetch('/api/stop', { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'error') {
                    alert(data.message);
                    stopBtn.disabled = false;
                    stopBtn.innerHTML = '⏹ Stop Pipeline';
                }
                // Success: button stays disabled, pollStatus will handle UI updates
            })
            .catch(() => {
                stopBtn.disabled = false;
                stopBtn.innerHTML = '⏹ Stop Pipeline';
            });
    }

    function runStage(stage) {
        let p_analysis = selectedPromptsText['Analysis Prompts'] || allPrompts['Analysis Prompts'][DEFAULT_PROMPT_KEYS['Analysis Prompts']];
        let p_shorten = selectedPromptsText['Shorten Prompts'] || allPrompts['Shorten Prompts'][DEFAULT_PROMPT_KEYS['Shorten Prompts']];
        let p_validate = selectedPromptsText['Validation Prompts'] || (allPrompts['Validation Prompts'] ? allPrompts['Validation Prompts'][DEFAULT_PROMPT_KEYS['Validation Prompts']] : '');
        
        // draw prompt is hardcoded to DEFAULT_DRAW_PROMPT_KEY under Analysis Prompts
        let p_draw = allPrompts['Analysis Prompts']['{{ default_draw_key }}'] || allPrompts['Analysis Prompts']['PROMPT_DRAW_IMAGE'];

        // Basic validation for prompts
        if (stage === 'analysis' && (!p_analysis || p_analysis.trim() === '')) {
            alert('请先明确选择或输入 Step 1 的 prompt 版本。\nPlease select or enter a prompt for Step 1 first.');
            setPromptCategory('Analysis Prompts');
            return;
        }
        if (stage === 'shorten' && (!p_shorten || p_shorten.trim() === '')) {
            alert('请先明确选择或输入 Step 3 的 prompt 版本。\nPlease select or enter a prompt for Step 3 first.');
            setPromptCategory('Shorten Prompts');
            return;
        }
        if (stage === 'validate' && (!p_validate || p_validate.trim() === '')) {
            alert('请先明确选择或输入 Step 4 的 prompt 版本。\nPlease select or enter a prompt for Step 4 first.');
            setPromptCategory('Validation Prompts');
            return;
        }
        if (stage === 'all' && (!p_analysis || p_analysis.trim() === '' || !p_shorten || p_shorten.trim() === '' || !p_validate || p_validate.trim() === '')) {
            alert('请先明确选择或输入所有步骤的 prompt 版本。\nPlease select or enter a prompt for all steps before running all.');
            if (!p_analysis || p_analysis.trim() === '') {
                setPromptCategory('Analysis Prompts');
            } else if (!p_shorten || p_shorten.trim() === '') {
                setPromptCategory('Shorten Prompts');
            } else {
                setPromptCategory('Validation Prompts');
            }
            return;
        }

        fetch(`/api/run/${stage}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                prompt: p_analysis,
                draw_prompt: p_draw,
                shorten_prompt: p_shorten,
                validation_prompt: p_validate
            })
        })
        .then(res => res.json())
        .then(data => {
            if(data.status === 'error') {
                alert(data.message);
            } else {
                pollStatus();
            }
        });
    }

    function goToVisualize() {
        const out = document.getElementById('output_dir').value;
        const inp = document.getElementById('input_dir').value;
        const url = `/visualize?input_dir=${encodeURIComponent(inp)}&output_dir=${encodeURIComponent(out)}`;
        if (wasRunning || document.getElementById('status_badge').classList.contains('running')) {
            window.open(url, '_blank');
        } else {
            window.location.href = url;
        }
    }
    
    function goToVisualizeErrors() {
        const out = document.getElementById('output_dir').value;
        window.location.href = `/visualize_errors?output_dir=${encodeURIComponent(out)}`;
    }
</script>
