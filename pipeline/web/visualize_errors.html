<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Pipeline - Error Visualizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #2b2b36 0%, #1a1a24 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f5f5f7;
            --text-muted: #a1a1a6;
            --accent: #ff6b6b;
            --font-stack: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
            --border: rgba(255,255,255,0.15);
        }

        body {
            font-family: var(--font-stack);
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
        }

        /* Top Nav */
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 28px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .top-nav .nav-brand { font-size: 1.2rem; font-weight: 700; color: #ff6b6b; }
        .top-nav .nav-links { display: flex; gap: 8px; }

        .nav-link {
            padding: 7px 16px;
            border-radius: 980px;
            font-size: 0.85rem;
            font-weight: 500;
            text-decoration: none;
            color: var(--text-main);
            background: rgba(255,255,255,0.05);
            transition: all 0.2s;
        }
        .nav-link:hover { background: rgba(255,255,255,0.1); }
        .nav-link.active { background: var(--accent); color: white; }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }

        .glass-card {
            background: var(--glass-bg);
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            padding: 24px;
            margin-bottom: 20px;
        }

        .page-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .page-nav button {
            padding: 10px 24px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.1);
            color: var(--text-main);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }
        .page-nav button:hover { background: rgba(255,255,255,0.2); }
        .page-nav button:disabled { opacity: 0.3; cursor: not-allowed; }

        .image-viewer {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .image-frame {
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            background: rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 400px;
        }

        .image-frame img {
            max-width: 100%;
            max-height: 600px;
            object-fit: contain;
        }

        .section-label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 10px;
            text-align: center;
        }

        .error-panel {
            background: rgba(255, 59, 48, 0.1);
            border: 1px solid rgba(255, 59, 48, 0.3);
            border-radius: 12px;
            padding: 20px; 
        }

        .error-title {
            color: #ff6b6b;
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        .error-reason {
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="top-nav">
    <div class="nav-brand">🚨 Error Visualizer</div>
    <div class="nav-links">
        <a href="/" class="nav-link">Dashboard</a>
        <a href="/visualize" class="nav-link">📊 Visualization</a>
    </div>
</div>

<div class="container">
    <input type="hidden" id="viz_output_dir" value="{{ config.output_directory }}">
    
    <div class="page-nav" id="page_nav" style="display: none;">
        <button onclick="prevPage()" id="btn_prev">← Prev</button>
        <div id="page_indicator">1 / 1</div>
        <button onclick="nextPage()" id="btn_next">Next →</button>
    </div>

    <div id="viewer_area">
        <div class="glass-card empty-state">
            <h2 style="color:white;">Loading Errors...</h2>
            <p>Scanning all_results.json files.</p>
        </div>
    </div>
</div>

<script>
    let errorData = [];
    let currentPage = 0;

    window.onload = function() {
        const params = new URLSearchParams(window.location.search);
        let outDir = document.getElementById('viz_output_dir').value;
        if (params.get('output_dir')) outDir = params.get('output_dir');
        
        loadErrors(outDir);
    };

    function loadErrors(outputDir) {
        fetch(`/api/visualize/errors?output_dir=${encodeURIComponent(outputDir)}`)
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    errorData = data.errors || [];
                    currentPage = 0;
                    renderPage();
                } else {
                    document.getElementById('viewer_area').innerHTML = `<div class="glass-card empty-state">Error: ${data.message}</div>`;
                }
            }).catch(e => {
                document.getElementById('viewer_area').innerHTML = `<div class="glass-card empty-state">Error loading API: ${e}</div>`;
            });
    }

    function renderPage() {
        const area = document.getElementById('viewer_area');
        const nav = document.getElementById('page_nav');

        if (errorData.length === 0) {
            nav.style.display = 'none';
            area.innerHTML = `
                <div class="glass-card empty-state">
                    <h2 style="color:var(--success);">✅ No Defects Found</h2>
                    <p>All scanned images passed the quality inspection.</p>
                </div>`;
            return;
        }

        nav.style.display = 'flex';
        document.getElementById('page_indicator').innerText = `${currentPage + 1} / ${errorData.length}`;
        document.getElementById('btn_prev').disabled = currentPage === 0;
        document.getElementById('btn_next').disabled = currentPage === errorData.length - 1;

        const item = errorData[currentPage];
        const origUrl = item.original_path ? `/api/image?path=${encodeURIComponent(item.original_path)}` : '';
        const genUrl = item.generated_path ? `/api/image?path=${encodeURIComponent(item.generated_path)}` : '';
        
        // Ensure newlines render as distinct lines
        const reasonHtml = escapeHtml(item.reason || "Unknown").replace(/\\n/g, "<br>").replace(/\n/g, "<br>");

        area.innerHTML = `
            <div style="font-size:1.1rem;font-weight:600;margin-bottom:10px;">${escapeHtml(item.image_key)}</div>
            <div style="color:var(--text-muted);font-size:0.85rem;margin-bottom:20px;">Theme: ${escapeHtml(item.theme || 'N/A')}</div>
            
            <div class="image-viewer">
                <div>
                    <div class="section-label">Original Image</div>
                    <div class="image-frame">
                        ${origUrl ? `<img src="${origUrl}" alt="Original">` : '<div style="color:#666;">Not Found</div>'}
                    </div>
                </div>
                <div>
                    <div class="section-label">Generated Image (with defect info)</div>
                    <div class="image-frame">
                        ${genUrl ? `<img src="${genUrl}" alt="Generated">` : '<div style="color:#666;">Not Found</div>'}
                    </div>
                </div>
            </div>

            <div class="error-panel">
                <div class="error-title">Issues Detected: [${escapeHtml(item.error_ids || '')}] (${escapeHtml(item.level || '')})</div>
                <div class="error-reason">${reasonHtml}</div>
            </div>
        `;
    }

    function prevPage() { if(currentPage > 0) { currentPage--; renderPage(); } }
    function nextPage() { if(currentPage < errorData.length-1) { currentPage++; renderPage(); } }

    function escapeHtml(unsafe) {
        if(!unsafe) return '';
        return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                     .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
</script>
</body>
</html>
